{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Admin Login</h1>
{% if request.query_params.get("error") %}
    <p class="error">Invalid password.</p>
{% endif %}
<form method="post">
    <label>Password: <input type="password" name="password" required></label>
    <button type="submit">Login</button>
</form>
{% endblock %}
